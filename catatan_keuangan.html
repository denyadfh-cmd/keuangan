<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan Keuangan</title>

<!-- PWA Meta -->
<meta name="theme-color" content="#0f0f0f">
<meta name="description" content="Aplikasi catatan keuangan pribadi">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keuangan">
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleTouchIcon">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2e2e2e;
  --text:#e8e4dc;--muted:#6b6b6b;
  --income:#4ade80;--income-dim:#1a3d28;
  --expense:#f87171;--expense-dim:#3d1a1a;
  --accent:#f5c842;--accent-dim:#3d3010;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.5;}

/* HEADER */
header{padding:32px 48px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{font-family:'Playfair Display',serif;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);}
.brand span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.date-badge{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.1em;padding:6px 12px;border:1px solid var(--border);border-radius:4px;}
.btn-install{display:none;padding:7px 14px;background:var(--accent);color:#0f0f0f;border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.05em;transition:all .2s;}
.btn-install:hover{background:#f0b800;transform:translateY(-1px);}
.btn-install.visible{display:flex;align-items:center;gap:6px;}
.btn-reset{padding:7px 14px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px;}
.btn-reset:hover{border-color:var(--expense);color:var(--expense);background:var(--expense-dim);}

/* DASHBOARD */
.dashboard{padding:32px 48px 0;display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px 28px;position:relative;overflow:hidden;}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.card-saldo::after{background:var(--accent);}
.card-income::after{background:var(--income);}
.card-expense::after{background:var(--expense);}
.card-label{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-family:'DM Mono',monospace;}
.card-amount{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em;transition:color .3s;}
.card-saldo .card-amount{color:var(--accent);}
.card-income .card-amount{color:var(--income);}
.card-expense .card-amount{color:var(--expense);}
.card-sub{font-size:12px;color:var(--muted);margin-top:6px;}

/* MAIN */
.main{display:grid;grid-template-columns:360px 1fr;gap:20px;padding:24px 48px 48px;}

/* FORM */
.form-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;align-self:start;position:sticky;top:20px;}
.panel-title{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:24px;display:flex;align-items:center;gap:10px;}
.panel-title::before{content:'';width:4px;height:18px;background:var(--accent);border-radius:2px;display:inline-block;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-family:'DM Mono',monospace;}
.field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:11px 14px;outline:none;transition:border-color .2s,box-shadow .2s;appearance:none;-webkit-appearance:none;}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.field input::placeholder{color:var(--muted);}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.type-btn{padding:11px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;text-align:center;font-weight:500;}
.type-btn.active-income{background:var(--income-dim);border-color:var(--income);color:var(--income);}
.type-btn.active-expense{background:var(--expense-dim);border-color:var(--expense);color:var(--expense);}
.btn-submit{width:100%;padding:13px;background:var(--accent);color:#0f0f0f;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.05em;transition:all .2s;margin-top:6px;}
.btn-submit:hover{background:#f0b800;transform:translateY(-1px);box-shadow:0 8px 20px rgba(245,200,66,.25);}
.btn-submit:active{transform:translateY(0);}

/* TABLE PANEL */
.table-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.table-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.table-header-left{display:flex;align-items:center;gap:16px;}
.filter-tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:8px;}
.filter-tab{padding:5px 14px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;font-weight:500;}
.filter-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3);}
.btn-export{padding:7px 14px;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;font-weight:500;}
.btn-export:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.count-badge{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
.table-wrap{overflow-x:auto;flex:1;}
table{width:100%;border-collapse:collapse;}
thead th{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:13px 18px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;animation:rowIn .3s ease forwards;opacity:0;}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
tbody tr:hover{background:var(--surface2);}
tbody tr:last-child{border-bottom:none;}
td{padding:14px 18px;font-size:14px;vertical-align:middle;}
.td-name{font-weight:500;}
.td-date{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap;}
.type-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-family:'DM Mono',monospace;}
.pill-income{background:var(--income-dim);color:var(--income);}
.pill-expense{background:var(--expense-dim);color:var(--expense);}
.td-amount{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;text-align:right;white-space:nowrap;}
.amount-income{color:var(--income);}
.amount-expense{color:var(--expense);}
.btn-delete{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;border-radius:6px;padding:5px 9px;font-size:13px;transition:all .2s;}
.btn-delete:hover{border-color:var(--expense);color:var(--expense);background:var(--expense-dim);}
.empty-state{text-align:center;padding:56px 32px;color:var(--muted);}
.empty-icon{font-size:36px;margin-bottom:14px;opacity:.4;}
.empty-state p{font-size:14px;line-height:1.6;}

/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px 18px;font-size:13px;font-weight:500;transform:translateY(80px);opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1);z-index:100;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.4);}
.toast.show{transform:translateY(0);opacity:1;}
.toast.toast-success{border-left:3px solid var(--income);}
.toast.toast-error{border-left:3px solid var(--expense);}
.toast.toast-info{border-left:3px solid var(--accent);}

@media(max-width:900px){
  header,.dashboard,.main{padding-left:16px;padding-right:16px;}
  .dashboard{grid-template-columns:1fr 1fr;}
  .card-saldo{grid-column:1/-1;}
  .main{grid-template-columns:1fr;}
  .form-panel{position:static;}
  .card-amount{font-size:26px;}
}
@media(max-width:500px){
  .dashboard{grid-template-columns:1fr;}
  .card-saldo{grid-column:auto;}
}
</style>
</head>
<body>

<header>
  <div class="brand">💰 Catatan <span>Keuangan</span></div>
  <div class="header-right">
    <div class="date-badge" id="dateBadge"></div>
    <button class="btn-reset" onclick="resetData()">🗑 Reset Data</button>
    <button class="btn-install" id="btnInstall">⬇ Install App</button>
  </div>
</header>

<div class="dashboard">
  <div class="card card-saldo">
    <div class="card-label">Saldo Saat Ini</div>
    <div class="card-amount" id="saldoDisplay">Rp 0</div>
    <div class="card-sub" id="saldoSub">0 transaksi tercatat</div>
  </div>
  <div class="card card-income">
    <div class="card-label">Total Pemasukan</div>
    <div class="card-amount" id="incomeDisplay">Rp 0</div>
    <div class="card-sub" id="incomeSub">0 transaksi</div>
  </div>
  <div class="card card-expense">
    <div class="card-label">Total Pengeluaran</div>
    <div class="card-amount" id="expenseDisplay">Rp 0</div>
    <div class="card-sub" id="expenseSub">0 transaksi</div>
  </div>
</div>

<div class="main">
  <div class="form-panel">
    <div class="panel-title">Tambah Transaksi</div>
    <div class="field">
      <label>Nama Transaksi</label>
      <input type="text" id="inputNama" placeholder="Contoh: Gaji bulan ini..." maxlength="80">
    </div>
    <div class="field">
      <label>Tanggal</label>
      <input type="date" id="inputTanggal">
    </div>
    <div class="field">
      <label>Tipe</label>
      <div class="type-toggle">
        <button class="type-btn active-income" id="btnPemasukan" onclick="setType('pemasukan')">+ Pemasukan</button>
        <button class="type-btn" id="btnPengeluaran" onclick="setType('pengeluaran')">− Pengeluaran</button>
      </div>
    </div>
    <div class="field">
      <label>Jumlah (Rp)</label>
      <input type="number" id="inputJumlah" placeholder="0" min="0">
    </div>
    <button class="btn-submit" onclick="addTransaction()">Catat Transaksi</button>
  </div>

  <div class="table-panel">
    <div class="table-header">
      <div class="table-header-left">
        <div class="panel-title" style="margin-bottom:0">Riwayat</div>
        <div class="count-badge" id="countBadge">0 data</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <div class="filter-tabs">
          <button class="filter-tab active" onclick="setFilter('semua',this)">Semua</button>
          <button class="filter-tab" onclick="setFilter('pemasukan',this)">Masuk</button>
          <button class="filter-tab" onclick="setFilter('pengeluaran',this)">Keluar</button>
        </div>
        <button class="btn-export" onclick="exportXLSX()">📥 Export .xlsx</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nama Transaksi</th>
            <th>Tanggal</th>
            <th>Tipe</th>
            <th style="text-align:right">Jumlah</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none">
        <div class="empty-icon">📋</div>
        <p>Belum ada transaksi.<br>Tambah transaksi pertamamu!</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- SheetJS untuk ekspor xlsx -->

// ── PWA MANIFEST (inline via blob) ──────────────────────
function setupPWA() {
  const manifest = {
    name: 'Catatan Keuangan',
    short_name: 'Keuangan',
    description: 'Aplikasi catatan keuangan pribadi',
    start_url: './',
    display: 'standalone',
    background_color: '#0f0f0f',
    theme_color: '#0f0f0f',
    orientation: 'portrait-primary',
    icons: [
      { src: 'data:image/png;base64,' + ICON192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
      { src: 'data:image/png;base64,' + ICON512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  document.getElementById('manifestLink').href = url;
  document.getElementById('appleTouchIcon').href = 'data:image/png;base64,' + ICON192;
}

// ── SERVICE WORKER (inline via blob) ────────────────────
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  const swCode = `
    const CACHE = 'keuangan-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./'])));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys => Promise.all(
        keys.filter(k => k !== CACHE).map(k => caches.delete(k))
      )));
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// ── INSTALL PROMPT ───────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btnInstall').classList.add('visible');
});
document.getElementById('btnInstall').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') showToast('App berhasil diinstall! 🎉','success');
  deferredPrompt = null;
  document.getElementById('btnInstall').classList.remove('visible');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('btnInstall').classList.remove('visible');
});

// ── STATE ────────────────────────────────────────────────
let transactions = JSON.parse(localStorage.getItem('catatanKeuangan') || '[]');
let selectedType = 'pemasukan';
let activeFilter = 'semua';

// ── INIT ─────────────────────────────────────────────────
function init() {
  setupPWA();
  registerSW();
  const today = new Date();
  document.getElementById('dateBadge').textContent = today.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('inputTanggal').value = today.toISOString().split('T')[0];
  render();
}

// ── HELPERS ──────────────────────────────────────────────
function rupiah(n) { return 'Rp ' + Math.abs(n).toLocaleString('id-ID'); }
function formatDate(d) { return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); }
function save() { localStorage.setItem('catatanKeuangan', JSON.stringify(transactions)); }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  const icons = {success:'✅',error:'❌',info:'ℹ️'};
  t.className = `toast toast-${type}`;
  t.innerHTML = `<span>${icons[type]}</span> ${msg}`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

// ── RESET ────────────────────────────────────────────────
function resetData() {
  if (!confirm('Reset semua data?\nSeluruh transaksi akan dihapus dan saldo kembali ke Rp 0.\nAksi ini tidak bisa dibatalkan.')) return;
  transactions = [];
  save(); render();
  showToast('Semua data berhasil direset.','info');
}

// ── TYPE TOGGLE ──────────────────────────────────────────
function setType(type) {
  selectedType = type;
  document.getElementById('btnPemasukan').className = 'type-btn' + (type==='pemasukan'?' active-income':'');
  document.getElementById('btnPengeluaran').className = 'type-btn' + (type==='pengeluaran'?' active-expense':'');
}

// ── FILTER ───────────────────────────────────────────────
function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

// ── ADD ──────────────────────────────────────────────────
function addTransaction() {
  const nama = document.getElementById('inputNama').value.trim();
  const tanggal = document.getElementById('inputTanggal').value;
  const jumlah = parseFloat(document.getElementById('inputJumlah').value);
  if (!nama) return showToast('Nama transaksi wajib diisi!','error');
  if (!tanggal) return showToast('Tanggal wajib diisi!','error');
  if (!jumlah || jumlah <= 0) return showToast('Jumlah harus lebih dari 0!','error');
  transactions.unshift({ id: Date.now(), nama, tanggal, tipe: selectedType, jumlah });
  save(); render();
  document.getElementById('inputNama').value = '';
  document.getElementById('inputJumlah').value = '';
  showToast(`Transaksi "${nama}" berhasil ditambahkan!`,'success');
}

// ── DELETE ───────────────────────────────────────────────
function deleteTransaction(id) {
  const tx = transactions.find(t=>t.id===id);
  if (!tx) return;
  if (!confirm(`Hapus transaksi "${tx.nama}"?\nAksi ini tidak bisa dibatalkan.`)) return;
  transactions = transactions.filter(t=>t.id!==id);
  save(); render();
  showToast('Transaksi dihapus.','info');
}

// ── EXPORT XLSX ──────────────────────────────────────────
// Format mengikuti template asli:
// Row 1: "CATATAN KEUANGAN" (merged A1:D1)
// Row 2: blank
// Row 3: PEMASUKAN | | | PENGELUARAN
// Row 4: <total_in> | | | <total_out>
// Row 5: | SALDO | |
// Row 6: | <saldo> | |
// Row 7: blank
// Row 8: blank
// Row 9: NAMA TRANSAKSI | TANGGAL | TYPE | JUMLAH
// Row 10+: data
function exportXLSX() {
  if (transactions.length === 0) {
    showToast('Tidak ada data untuk diekspor!','error');
    return;
  }
  const wb = XLSX.utils.book_new();
  const totalIn = transactions.filter(t=>t.tipe==='pemasukan').reduce((s,t)=>s+t.jumlah,0);
  const totalOut = transactions.filter(t=>t.tipe==='pengeluaran').reduce((s,t)=>s+t.jumlah,0);
  const saldo = totalIn - totalOut;

  // Build rows sesuai template
  const rows = [
    ['CATATAN KEUANGAN', '', '', ''],           // Row 1
    ['', '', '', ''],                            // Row 2
    ['PEMASUKAN', '', '', 'PENGELUARAN'],        // Row 3
    [totalIn, '', '', totalOut],                 // Row 4
    ['', 'SALDO', '', ''],                       // Row 5
    ['', saldo, '', ''],                         // Row 6
    ['', '', '', ''],                            // Row 7
    ['', '', '', ''],                            // Row 8
    ['NAMA TRANSAKSI', 'TANGGAL', 'TYPE', 'JUMLAH'], // Row 9
  ];

  // Data transaksi (urut dari terlama ke terbaru agar rapi)
  const sorted = [...transactions].sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
  sorted.forEach(t => {
    rows.push([t.nama, t.tanggal, t.tipe, t.jumlah]);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);

  // Column widths
  ws['!cols'] = [{wch:25},{wch:15},{wch:12},{wch:14}];

  // Merge A1:D1 untuk judul
  ws['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:3} }];

  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');

  const now = new Date();
  const fname = `Catatan_keuangan_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}.xlsx`;
  XLSX.writeFile(wb, fname);
  showToast(`File "${fname}" berhasil diunduh!`,'success');
}

// ── RENDER ───────────────────────────────────────────────
function render() { renderDashboard(); renderTable(); }

function renderDashboard() {
  const totalIn = transactions.filter(t=>t.tipe==='pemasukan').reduce((s,t)=>s+t.jumlah,0);
  const totalOut = transactions.filter(t=>t.tipe==='pengeluaran').reduce((s,t)=>s+t.jumlah,0);
  const saldo = totalIn - totalOut;
  const cntIn = transactions.filter(t=>t.tipe==='pemasukan').length;
  const cntOut = transactions.filter(t=>t.tipe==='pengeluaran').length;
  const saldoEl = document.getElementById('saldoDisplay');
  saldoEl.textContent = (saldo<0?'- ':'')+rupiah(saldo);
  saldoEl.style.color = saldo<0?'var(--expense)':'var(--accent)';
  document.getElementById('saldoSub').textContent = `${transactions.length} transaksi tercatat`;
  document.getElementById('incomeDisplay').textContent = rupiah(totalIn);
  document.getElementById('expenseDisplay').textContent = rupiah(totalOut);
  document.getElementById('incomeSub').textContent = `${cntIn} transaksi`;
  document.getElementById('expenseSub').textContent = `${cntOut} transaksi`;
}

function renderTable() {
  const filtered = activeFilter==='semua' ? transactions : transactions.filter(t=>t.tipe===activeFilter);
  document.getElementById('countBadge').textContent = `${filtered.length} data`;
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  if (filtered.length===0) {
    tbody.innerHTML='';
    empty.style.display='block';
    return;
  }
  empty.style.display='none';
  tbody.innerHTML = filtered.map((t,i)=>`
    <tr style="animation-delay:${i*.04}s">
      <td class="td-name">${escHtml(t.nama)}</td>
      <td class="td-date">${formatDate(t.tanggal)}</td>
      <td><span class="type-pill ${t.tipe==='pemasukan'?'pill-income':'pill-expense'}">${t.tipe==='pemasukan'?'↑ Masuk':'↓ Keluar'}</span></td>
      <td class="td-amount ${t.tipe==='pemasukan'?'amount-income':'amount-expense'}">${t.tipe==='pemasukan'?'+':'-'} ${rupiah(t.jumlah)}</td>
      <td><button class="btn-delete" onclick="deleteTransaction(${t.id})" title="Hapus">✕</button></td>
    </tr>
  `).join('');
}

document.addEventListener('keydown', e=>{
  if (e.key==='Enter' && document.activeElement.tagName==='INPUT') addTransaction();
});

init();
</script>
</body>
</html>
